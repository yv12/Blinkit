<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Swipe discovery MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
<style>
.suggest{
  list-style:none;margin:-6px 0 12px;padding:0;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;
}
.suggest[hidden]{display:none !important}
.suggest button{
  display:block;width:100%;text-align:left;border:none;background:#fff;cursor:pointer;
  padding:10px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);
  border-bottom:1px solid var(--line);
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button:focus-visible{background:var(--rose-tint)}
.result{
  display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
}
.result img{width:52px;height:52px;object-fit:contain;border-radius:10px;background:var(--tile);flex:0 0 52px}
.result .meta{font-size:11px;color:var(--ink-soft)}
.result strong{display:block;font-size:13px;margin-bottom:2px}
.result .actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;align-items:stretch;min-width:88px}
.result .actions button{
  border:none;border-radius:999px;padding:7px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;
}
.result .add{background:#CD130A;color:#fff}
.result .open{background:var(--rose-tint);color:var(--maroon)}
.result .qty{
  display:inline-flex;align-items:center;justify-content:space-between;
  border:1.5px solid #CD130A;border-radius:999px;overflow:hidden;background:#fff;height:30px;
}
.result .qty button{
  width:30px;height:30px;border:none;border-radius:0;background:#fff;color:#CD130A;
  font-size:16px;font-weight:800;cursor:pointer;padding:0;line-height:1;
}
.result .qty span{
  min-width:24px;text-align:center;font-size:12px;font-weight:800;color:#1F1F1F;
}
.empty{padding:28px 8px;text-align:center;color:var(--ink-soft);font-size:13px;font-weight:700}
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:#1F1F1F;color:#fff;padding:10px 14px;border-radius:999px;
  font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;
  z-index:50;max-width:min(340px,90vw);text-align:center;
}
.toast.show{opacity:1}
.learned{margin:0 0 10px;font-size:11px;font-weight:800;color:#0d5c2e}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <div id="hero-host"></div>
    <main class="body">
      <ul class="suggest" id="suggest" hidden></ul>
      <p class="learned" id="learned" hidden></p>
      <h2 class="sec-title">Search results</h2>
      <p class="sec-sub" id="sub">Type a product — results update live</p>
      <div id="results"></div>
    </main>
  </div>
  <nav class="nav" id="nav-host"></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import { catalog } from "../src/data/loadDemoData.js";
import { productImageUrl } from "../src/lib/productImage.js";
import { searchProducts, suggestSearch } from "../src/lib/productSearch.js";
import { mountNav } from "./nav.js";
import { mountHero } from "./hero.js";
import { mountCartSheet } from "./cartSheet.js";
import { ensureEngine, recordSearch, cartQtyFor, adjustCartQty, onEngineChange, snapshot } from "./engineBridge.js";
import { allowsDietProduct, resolveDietMode, DIET } from "../src/lib/dietProfile.js";
import { getPersonaBundle, DEFAULT_PERSONA_ID } from "../src/data/loadDemoData.js";

const params = new URLSearchParams(location.search);
const initialQ = params.get("q") || "";

mountHero(document.getElementById("hero-host"), { searchValue: initialQ });
mountNav(document.getElementById("nav-host"), "home");
mountCartSheet();

const input = document.querySelector("[data-search-input]");
const form = document.querySelector("[data-search-form]");
const resultsEl = document.getElementById("results");
const suggestEl = document.getElementById("suggest");
const subEl = document.getElementById("sub");
const learnedEl = document.getElementById("learned");
const toastEl = document.getElementById("toast");

let lastQuery = "";
let toastTimer = 0;

function say(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

function shortName(name = "") {
  const cut = String(name).split(",")[0].trim();
  return cut.length > 52 ? `${cut.slice(0, 50)}…` : cut;
}

function setLearned(msg) {
  if (!msg) {
    learnedEl.hidden = true;
    return;
  }
  learnedEl.hidden = false;
  learnedEl.textContent = msg;
}

function paintSuggest(q) {
  const suggestions = suggestSearch(catalog, q, { limit: 6 });
  if (!suggestions.length || !q.trim()) {
    suggestEl.hidden = true;
    suggestEl.innerHTML = "";
    return;
  }
  suggestEl.hidden = false;
  suggestEl.innerHTML = suggestions
    .map(
      (s) =>
        `<li><button type="button" data-sid="${s.product_id}" data-label="${s.label.replace(/"/g, "&quot;")}">${s.label}</button></li>`,
    )
    .join("");
}

function addControlHtml(id) {
  const qty = cartQtyFor(id);
  if (qty <= 0) {
    return `<button type="button" class="add" data-add="${id}">ADD</button>`;
  }
  return `<div class="qty" data-qty-wrap="${id}">
    <button type="button" data-dec="${id}" aria-label="Decrease quantity">−</button>
    <span data-qty="${id}">${qty}</span>
    <button type="button" data-inc="${id}" aria-label="Increase quantity">+</button>
  </div>`;
}

function currentDietMode() {
  const snap = snapshot();
  if (snap?.state?.diet_mode) return snap.state.diet_mode;
  const personaId = snap?.personaId || DEFAULT_PERSONA_ID;
  const { persona } = getPersonaBundle(personaId);
  return resolveDietMode(persona, snap?.state || null, null).mode;
}

function dietFilter(hits) {
  const mode = currentDietMode();
  return hits.filter(({ product }) => allowsDietProduct(mode, product));
}

function paintResults(q) {
  const hits = dietFilter(searchProducts(catalog, q, { limit: 36 })).slice(0, 24);
  if (!q.trim()) {
    resultsEl.innerHTML = `<p class="empty">Try “protein bar”, “paneer”, or a brand</p>`;
    subEl.textContent = "Type a product — results update live";
    return;
  }
  if (!hits.length) {
    const mode = currentDietMode();
    const dietHint =
      mode === DIET.VEG
        ? " (veg profile — non-veg / eggs hidden)"
        : mode === DIET.EGGETARIAN
          ? " (eggetarian — meat/fish hidden)"
          : "";
    resultsEl.innerHTML = `<p class="empty">No matches for “${q}”${dietHint}</p>`;
    subEl.textContent = "Try another spelling or brand";
    return;
  }
  const mode = currentDietMode();
  subEl.textContent = `${hits.length} match${hits.length === 1 ? "" : "es"}${
    mode === DIET.VEG ? " · veg safe" : mode === DIET.EGGETARIAN ? " · egg ok, no meat" : ""
  }`;
  resultsEl.innerHTML = hits
    .map(({ product: p }) => {
      const img = productImageUrl(p, p.image_url) || "";
      return `<article class="result" data-id="${p.id}">
        <img src="${img}" alt="">
        <div style="min-width:0;flex:1">
          <strong>${shortName(p.name)}</strong>
          <div class="meta">Rs ${Math.round(p.price || 0)} · ${p.category || p.top_category || ""}</div>
        </div>
        <div class="actions">
          <button type="button" class="open" data-open="${p.id}">Open</button>
          ${addControlHtml(p.id)}
        </div>
      </article>`;
    })
    .join("");
}

async function onQueryChange(q, { recordLight = false } = {}) {
  lastQuery = q;
  paintSuggest(q);
  paintResults(q);
  const url = new URL(location.href);
  if (q.trim()) url.searchParams.set("q", q.trim());
  else url.searchParams.delete("q");
  history.replaceState(null, "", url);
  if (recordLight && q.trim().length >= 3) {
    await recordSearch({ query: q, action: "typeahead" });
  }
}

async function submitQuery(q) {
  const query = String(q || "").trim();
  if (!query) return;
  await recordSearch({ query, action: "submit" });
  setLearned(`Using “${query}” to tune your next picks`);
  say("Search noted for recommendations");
  paintSuggest("");
  paintResults(query);
}

async function openProduct(id) {
  const p = catalog.find((x) => x.id === id);
  if (!p) return;
  await recordSearch({ query: lastQuery || p.name, productId: id, action: "open" });
  setLearned(`Interested in ${shortName(p.name)} — rails & swipes will lean this way`);
  say("Interest saved to your taste profile");
}

async function addProduct(id) {
  const p = catalog.find((x) => x.id === id);
  if (!p) return;
  const res = await recordSearch({ query: lastQuery || p.name, productId: id, action: "add" });
  const qty = res?.qty || cartQtyFor(id);
  setLearned(`Added ${shortName(p.name)} × ${qty}`);
  say(qty > 1 ? `Cart · ${qty}` : "Added to cart");
  paintResults(lastQuery || input?.value || "");
}

async function bumpQty(id, delta) {
  const res = await adjustCartQty(id, delta);
  if (!res?.ok && delta < 0) {
    paintResults(lastQuery || input?.value || "");
    return;
  }
  const qty = cartQtyFor(id);
  say(qty ? `Cart · ${qty}` : "Removed from cart");
  paintResults(lastQuery || input?.value || "");
}

suggestEl.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-sid]");
  if (!btn) return;
  const label = btn.getAttribute("data-label") || "";
  if (input) input.value = label;
  submitQuery(label);
});

resultsEl.addEventListener("click", (e) => {
  const add = e.target.closest("[data-add]");
  if (add) {
    addProduct(add.getAttribute("data-add"));
    return;
  }
  const inc = e.target.closest("[data-inc]");
  if (inc) {
    bumpQty(inc.getAttribute("data-inc"), 1);
    return;
  }
  const dec = e.target.closest("[data-dec]");
  if (dec) {
    bumpQty(dec.getAttribute("data-dec"), -1);
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open) openProduct(open.getAttribute("data-open"));
});

form?.addEventListener("submit", (e) => {
  e.preventDefault();
  submitQuery(input?.value || "");
});

let debounce = 0;
input?.addEventListener("input", () => {
  const q = input.value || "";
  clearTimeout(debounce);
  debounce = setTimeout(() => onQueryChange(q, { recordLight: true }), 220);
});

onEngineChange(() => {
  if (lastQuery) paintResults(lastQuery);
});

await ensureEngine();
if (initialQ) {
  if (input) input.value = initialQ;
  await onQueryChange(initialQ);
  await submitQuery(initialQ);
} else {
  paintResults("");
}
</script>
</body>
</html>
