<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe discovery MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
<style>
/* ---- swipe block ---- */
.crush{background:var(--rose-tint);border:1px solid var(--rose-line);border-radius:var(--r-lg);overflow:hidden}
.lights{display:block;width:100%;height:26px}
.crush-in{padding:2px 14px 14px}
.crush-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.crush-head h2{font-size:14px;font-weight:800;color:#CD130A}
.crush-head .left{font-size:11px;color:var(--rose-dust)}
.stack{position:relative;height:200px;margin-bottom:12px}
.stack .back2{position:absolute;left:22px;right:22px;top:14px;bottom:6px;background:var(--rose-dust);border-radius:var(--r-md)}
.stack .back1{position:absolute;left:14px;right:14px;top:7px;bottom:10px;background:var(--rose);border-radius:var(--r-md)}
.rose-stem{position:absolute;top:0;width:26px;height:100%}
.rose-stem.l{left:-10px} .rose-stem.r{right:-10px}
.card{position:absolute;left:6px;right:6px;top:0;bottom:14px;background:var(--maroon);border:1px solid var(--cerise);
  border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;
  transition:transform .22s ease,opacity .22s ease;touch-action:pan-y}
.card-main{display:flex;gap:12px;align-items:stretch;flex:1;min-height:0;margin:0}
.card .pimg{width:112px;flex:0 0 112px;height:auto;min-height:100%;object-fit:contain;border-radius:12px;background:#fff}
.card-copy{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:2px 0}
.pname{font-size:14px;font-weight:800;color:#fff;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bio{font-size:12px;color:var(--rose);font-style:italic;line-height:1.35;margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prices{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.price{font-size:17px;font-weight:800;color:#fff}
.mrp{font-size:11px;color:var(--rose-dust);text-decoration:line-through}
.actions{display:flex;justify-content:center;align-items:flex-end;gap:14px}
.candle{width:20px;height:46px;margin-bottom:14px}
.act{text-align:center}
.act button{border-radius:50%;display:grid;place-items:center;cursor:pointer;border:none;padding:0}
.act button:focus-visible{outline:2px solid #CD130A;outline-offset:2px}
.act .lbl{font-size:9px;color:#000000;margin-top:4px;font-weight:700}
.btn-skip{width:42px;height:42px;background:#FFFFFF;border:1.5px solid #000000 !important}
.btn-save{width:52px;height:52px;background:#CD130A}
.btn-add{width:42px;height:42px;background:#000000;border:1.5px solid #000000 !important}
.act svg{width:20px;height:20px}
.btn-save svg{width:24px;height:24px}
.toast{margin-top:12px;text-align:center;font-size:11px;padding:8px;border-radius:var(--r-sm);background:var(--cerise);color:#fff;display:none}
.done{text-align:center;padding:24px 12px;color:var(--maroon)}
.done p{font-size:13px} .done small{font-size:11px;color:var(--rose-dust)}
.match-close{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px}
.match-close-line{font-size:16px;font-weight:800;line-height:1.35;max-width:16rem}
.match-close-cta{
  margin-top:6px;border:none;border-radius:999px;padding:10px 16px;cursor:pointer;
  background:var(--cerise);color:#fff;font:inherit;font-size:12px;font-weight:800;
}
.freq-wrap{margin:12px 0 4px}
.freq-wrap .sec-title{margin-bottom:4px}
.freq-carousel{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.freq-carousel::-webkit-scrollbar{display:none}
.freq-slide{
  scroll-snap-align:start;flex:0 0 108px;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;background:#fff;
}
.freq-slide img{
  width:100%;height:52px;object-fit:contain;border-radius:8px;background:var(--tile);display:block;margin-bottom:6px;
}
.freq-slide .n{
  font-size:11px;font-weight:700;line-height:1.25;color:var(--ink);min-height:2.4em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.freq-slide .p{font-size:11px;font-weight:800;color:var(--maroon);margin-top:2px}
.freq-hint{font-size:10px;color:var(--rose-dust);margin:0;text-align:right}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.rail .tile{flex:0 0 108px}
.promo-strip{
  margin:14px 0;padding:14px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--rose-tint),#fff);border:1px solid var(--rose-line);
}
.promo-strip strong{display:block;font-size:13px;color:var(--maroon);margin-bottom:4px}
.promo-strip span{font-size:11px;color:var(--rose-dust)}
.persona-chip{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:11px;color:var(--maroon);font-weight:800}
.persona-chip a{color:var(--cerise);font-weight:800;text-decoration:none}
.rails-live-badge{
  display:inline-block;margin:14px 0 0;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:800;color:var(--maroon);background:var(--rose-tint);
  border:1px solid var(--rose-line);
}
.rails-live-badge[data-learned="1"]{background:#e8f7ee;border-color:#9fd4b0;color:#0d5c2e}
.rails-flash{animation:railsPulse .7s ease}
.order-live-banner{
  margin:12px 0 0;padding:10px 12px;border-radius:12px;
  background:#e8f7ee;border:1px solid #9fd4b0;color:#0d5c2e;
  font-size:12px;font-weight:800;line-height:1.35;
}
.order-live-banner[hidden]{display:none !important}
.tile-bridge{
  margin-top:4px;font-size:10px;font-weight:700;color:#750000;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
@keyframes railsPulse{
  0%{box-shadow:0 0 0 0 rgba(222,49,99,.35)}
  100%{box-shadow:0 0 0 12px transparent}
}
.rail.rails-flash .tile{animation:tilePop .45s ease}
@keyframes tilePop{
  0%{transform:scale(.96);opacity:.6}
  100%{transform:scale(1);opacity:1}
}
@media (prefers-reduced-motion:reduce){.card,.rails-flash,.rail.rails-flash .tile{transition:none;animation:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <div id="hero-host"></div>
    <main class="body">
      <section class="crush" id="crush" aria-label="Product discovery cards"></section>
      <div id="freq-wrap"></div>
      <p class="order-live-banner" id="order-live-banner" hidden></p>
      <h2 class="sec-title">Top picks for you</h2>
      <div class="rail" id="top-rail"></div>
      <h2 class="sec-title">Something different</h2>
      <div class="rail" id="diff-rail"></div>
      <h2 class="sec-title">Household essentials</h2>
      <div class="grid" id="essentials"></div>
    </main>
  </div>
  <nav class="nav" id="nav-host"></nav>
</div>

<script type="module">
import { getPersona } from "./recommend.js";
import { mountEngineSwipe } from "./swipeEngine.js";
import { mountNav } from "./nav.js";
import { mountHero } from "./hero.js";
import { initBackgroundNudges } from "./nudges.js";
import { mountHomeRails } from "./homeRails.js";
import { mountCartSheet } from "./cartSheet.js";

mountHero(document.getElementById("hero-host"));
mountNav(document.getElementById("nav-host"), "home");
mountCartSheet();

const persona = getPersona();

function tileHtml(p) {
  return `<div class="tile">
    <div class="img"><img src="${p.image}" alt="${p.name}"></div>
    <div class="n">${p.name}</div>
    <div class="p">Rs ${p.price}</div>
  </div>`;
}

function shortName(name = "") {
  const cut = String(name).split(",")[0].trim();
  return cut.length > 48 ? `${cut.slice(0, 46)}…` : cut;
}

// Frequently bought = compact vertical carousel (basket only, no category grids)
const catalog = persona.catalog;
const seenFreq = new Set();
const freqItems = [...(persona.basket || [])].filter((p) => {
  const key = p.name || p.id;
  if (!key || seenFreq.has(key)) return false;
  seenFreq.add(key);
  return true;
}).slice(0, 8);

const freqSlides = freqItems.map((p) => `
  <div class="freq-slide">
    <img src="${p.image}" alt="">
    <div class="n">${shortName(p.name)}</div>
    <div class="p">Rs ${p.price}</div>
  </div>`).join("");

document.getElementById("freq-wrap").innerHTML = `
  <div class="freq-wrap">
    <h2 class="sec-title">Frequently bought</h2>
    <div class="freq-carousel" id="freq-carousel" aria-label="Frequently bought carousel">
      ${freqSlides || `<div class="freq-slide"><div class="n">No usuals yet</div></div>`}
    </div>
  </div>`;

document.getElementById("essentials").innerHTML = catalog.L2.slice(0, 3).map(tileHtml).join("");

initBackgroundNudges();
await mountEngineSwipe(document.getElementById("crush"), {
  personaId: "yash",
  mode: "cart",
  title: "It starts with a swipe.",
});

// Mount after engine init so rails see loaded swipe affinity
mountHomeRails({
  topRail: document.getElementById("top-rail"),
  diffRail: document.getElementById("diff-rail"),
  banner: document.getElementById("order-live-banner"),
});
</script>
</body>
</html>
