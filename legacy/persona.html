<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona switcher — Swipe discovery MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
<style>
.persona-lead{font-size:12px;color:var(--ink-soft);margin:-4px 0 12px;line-height:1.4}
.persona-list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.persona-card{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--maroon);border:1px solid var(--cerise);border-radius:var(--r-md);
  padding:14px 16px;color:#fff;font:inherit;
}
.persona-card:focus-visible{outline:2px solid var(--cerise);outline-offset:2px}
.persona-card .row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.badge{background:var(--cerise);color:#fff;font-size:10px;font-weight:600;padding:3px 9px;border-radius:10px}
.cat{color:var(--rose);font-size:10px}
.pname{font-size:16px;font-weight:800;color:#fff;line-height:1.25}
.bio{font-size:12px;color:var(--rose);font-style:italic;margin:0 0 8px}
.persona-card .basket{font-size:11px;color:var(--rose-dust);line-height:1.35}
.persona-card.on{box-shadow:inset 0 0 0 2px var(--candle)}
.persona-card.on .badge{background:var(--brand-green)}
.persona-go{
  display:block;width:100%;margin:14px 0 8px;padding:12px 14px;border:none;border-radius:var(--r-md);
  background:var(--cerise);color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer;text-align:center;text-decoration:none;
}
.persona-go:focus-visible{outline:2px solid var(--cerise);outline-offset:2px}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <div id="hero-host"></div>
    <main class="body">
      <h2 class="sec-title">Which ladder should we show?</h2>
      <p class="persona-lead">Yash is your real order history. Other personas are demo ladders.</p>
      <div class="persona-list" id="list" role="listbox" aria-label="Personas"></div>
      <a class="persona-go" id="go" href="./index.html">Go to Home →</a>
    </main>
  </div>
  <nav class="nav" id="nav-host"></nav>
</div>

<script type="module">
import { PERSONAS, getPersonaId, setPersonaId } from "./recommend.js";
import { mountNav } from "./nav.js";
import { mountHero } from "./hero.js";
import { mountCartSheet } from "./cartSheet.js";

mountHero(document.getElementById("hero-host"));
mountNav(document.getElementById("nav-host"), "home");
mountCartSheet();

const list = document.getElementById("list");
let selected = getPersonaId();

function render() {
  list.innerHTML = "";
  for (const p of Object.values(PERSONAS)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "persona-card" + (p.id === selected ? " on" : "");
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-selected", p.id === selected ? "true" : "false");
    btn.innerHTML = `
      <div class="row">
        <span class="badge">${p.id === selected ? "Selected" : "Persona"}</span>
        <span class="cat">${p.id}</span>
      </div>
      <h3 class="pname">${p.name}</h3>
      <p class="bio">${p.blurb}</p>
      <p class="basket">Basket: ${p.basket.map(b => b.name).join(" · ")}</p>`;
    btn.onclick = () => {
      selected = setPersonaId(p.id);
      render();
    };
    list.appendChild(btn);
  }
}

document.getElementById("go").addEventListener("click", () => setPersonaId(selected));
render();
</script>
</body>
</html>
